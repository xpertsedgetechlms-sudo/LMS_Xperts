name: xpertsedge-lms
services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: xpertsedge_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xpertsedge_lms"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      DB_URL: jdbc:postgresql://db:5432/xpertsedge_lms
      DB_USERNAME: xpertsedge
      SERVER_ADDRESS: 0.0.0.0
      SESSION_COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${LMS_DOMAIN:?Set LMS_DOMAIN in deploy/.env.production}
    secrets:
      - DB_PASSWORD
    logging: *logs
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      LMS_DOMAIN: ${LMS_DOMAIN:?Set LMS_DOMAIN in deploy/.env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logs
secrets:
  DB_PASSWORD:
    file: ./deploy/secrets/db_password.txt
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
