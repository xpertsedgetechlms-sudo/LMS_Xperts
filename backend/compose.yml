services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: xpertsedge_lms
      POSTGRES_USER: xpertsedge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lms-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpertsedge -d xpertsedge_lms"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  lms-postgres:
