spring:
  application:
    name: xpertsedge-lms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xpertsedge_lms}
    username: ${DB_USERNAME:xpertsedge}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        name: XPERTSEDGE_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
lms:
  notifications:
    email-enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
  recovery:
    enabled: ${RECOVERY_ENABLED:false}
    base-url: ${PUBLIC_APP_URL:}
    from: ${MAIL_FROM:}
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    smtp-user: ${SMTP_USER:}
    smtp-password: ${SMTP_PASSWORD:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
